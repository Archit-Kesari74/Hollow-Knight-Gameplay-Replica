<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="index.css" rel="stylesheet">
</head>
<body>
    <header class="game-header">

        <div class="column">
            <img src="logo.png" width="500px" height="100px" id="logo">
            
            <div class="game-info">
                <span>Lives: <img src="Lives.png" width="80px" height="18px"></span><br>
                <span>Geo: <img src="Geo.png" width="23px" height="23px"> 732</span><br>
                <span>Level: 7</span>
            </div>
        </div>

        <div class="quest">
            <h2>Quests</h2>
            <ul>
                <li>Find the Lost Stag</li>        
                <li>Reach the Ancient Basin</li>
            </ul>
        </div>

    </header>

    <footer class="game-panel">

        <div class="controls">

            <div class="move">
                <span class="letters">W</span>
                <span class="letters">A</span>
                <span class="letters">S</span>
                <span class="letters">D</span>
                <span> - Move</span>
            </div>

            <div class="jump">
                <span>[ ]</span>
                <span> - Jump</span>
            </div>

            <div class="attack">
                <span class="letters">J</span>
                <span> - Attack</span>
            </div>

        </div>

        <div class="inventory">

                <img src="sword.png" width="65px" height="60px" class="invimg">
                <img src="quartz.png" width="65px" height="60px" class="invimg">
                <img src="shard.png" width="65px" height="60px" class="invimg">
                <img src="spell.png" width="65px" height="60px" class="invimg">
                <img src="empty.png" width="65px" height="60px" class="invimg">

        </div>

        <div class="menu">
            <a href="settings.html">
            <button id="menu"><img src="Menu.png" width="120px" height="120px"></button>
            </a>
        </div>

    </footer>

</body>
</html>
